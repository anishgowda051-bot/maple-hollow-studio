name: Doctor
# Self-healing: any bot run that fails gets one automatic retry of its failed jobs.
on:
  workflow_run:
    workflows: [Produce, Finish, Publish, Analytics]
    types: [completed]
permissions: {actions: write}
jobs:
  retry:
    name: "🩺 Doctor"
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - run: gh run rerun ${{ github.event.workflow_run.id }} --failed -R "$GITHUB_REPOSITORY"
        env: {GH_TOKEN: '${{ github.token }}'}
