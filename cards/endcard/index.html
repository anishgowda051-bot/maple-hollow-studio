<!doctype html>
<!-- Maple Hollow end card (HyperFrames). finish.py copies this folder, fills {{LESSON}}, adds bg.png + font, renders 6s MP4. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Lucky; src: url(LuckiestGuy.ttf); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #2b1b4a; }
  #stage { position: relative; width: 1920px; height: 1080px; font-family: Lucky, sans-serif; color: #fff; }
  #bg { position: absolute; inset: -40px; width: 2000px; height: 1160px; object-fit: cover; filter: blur(14px) brightness(.55) saturate(1.2); }
  .center { position: absolute; left: 0; right: 0; text-align: center; padding: 0 160px; }
  #label { top: 250px; font-size: 64px; color: #ffd23f; -webkit-text-stroke: 4px #2b1b4a; paint-order: stroke fill; }
  #lesson { top: 360px; font-size: 92px; line-height: 1.15; -webkit-text-stroke: 6px #2b1b4a; paint-order: stroke fill; }
  #bye { top: 860px; font-size: 58px; color: #ffd23f; -webkit-text-stroke: 4px #2b1b4a; paint-order: stroke fill; }
  .star { position: absolute; font-size: 90px; }
</style>
</head>
<body>
<div id="stage" data-composition-id="endcard" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <img id="bg" class="clip" src="bg.png" data-start="0" data-duration="6" data-track-index="0">
  <div id="label" class="center clip" data-start="0" data-duration="6" data-track-index="1">⭐ Today's lesson ⭐</div>
  <div id="lesson" class="center clip" data-start="0" data-duration="6" data-track-index="2">{{LESSON}}</div>
  <div id="bye" class="center clip" data-start="0" data-duration="6" data-track-index="3">See you next time in Maple Hollow!</div>
  <div id="s1" class="star clip" style="left:150px;top:120px" data-start="0" data-duration="6" data-track-index="4">✨</div>
  <div id="s2" class="star clip" style="right:150px;top:700px" data-start="0" data-duration="6" data-track-index="5">✨</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.from('#bg', { scale: 1.15, duration: 6, ease: 'none' }, 0)
    .from('#label', { y: -80, opacity: 0, duration: .6, ease: 'back.out(2)' }, .2)
    .from('#lesson', { scale: .6, opacity: 0, duration: .8, ease: 'back.out(1.8)' }, .6)
    .from('#bye', { y: 80, opacity: 0, duration: .6, ease: 'back.out(2)' }, 2.6)
    .fromTo('.star', { rotation: -20, scale: .4, opacity: 0 }, { rotation: 20, scale: 1, opacity: 1, duration: 1.2, stagger: .3, ease: 'elastic.out(1, .5)' }, 1)
    .to('#stage', { opacity: 0, duration: .5 }, 5.5);
  window.__timelines = window.__timelines || {};
  window.__timelines.endcard = tl;
</script>
</body>
</html>
